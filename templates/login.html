{% extends "base.html" %}

{% block title %}
Login
{% endblock %}


{% block content %}

<main class="auth">

    <div class="panel">

        <h1>
            Welcome Back
        </h1>


        {% if error %}

            <p class="error">
                {{ error }}
            </p>

        {% endif %}


        <form method="post">

            <label>
                Username

                <input
                    name="username"
                    required
                >
            </label>


            <label>
                Password

                <input
                    name="password"
                    type="password"
                    required
                >
            </label>


            <button
                class="primary"
                type="submit"
            >
                Sign In
            </button>

        </form>


        <p>
            New here?
            <a href="/register">
                Create an account
            </a>
        </p>

    </div>

</main>

{% endblock %}
